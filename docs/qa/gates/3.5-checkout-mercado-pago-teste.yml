  security:
    status: PASS
    notes: Findings locais corrigidos. Test seller validado, sessão/dono nas rotas,
      corpo permitido, snapshot de preço, reconciliação autenticada e erros
      sanitizados. Token permanece no arquivo privado ignorado; não foi
      reproduzido no gate.
  reliability:
    status: CONCERNS
    notes: Concorrência, reinício, resposta perdida, recuperação, rollback e
      concessão única passaram localmente. Aprovação externa real, isolamento,
      idempotência e restauração no app web também passaram. Falta execução do
      runtime nativo.
  performance:
    status: PASS
    notes: Timeout por chamada, nenhuma transação SQLite aberta durante rede e 61
      jornadas concluídas. Não constitui teste de carga ou prontidão produtiva.
  maintainability:
    status: PASS
    notes: Sem novas dependências; migração aditiva, fronteira de gateway injetável,
      matriz e regressões específicas; configuração e comandos documentados.
