top_issues:
  - id: TEST-002
    severity: medium
    finding: Navegador externo, retorno manual e SQLite no dispositivo Android/iOS
      não foram executados; export Android e Chrome web não comprovam o runtime
      nativo.
    suggested_action: Executar o fluxo crítico em aparelho/emulador SDK 54 e
      registrar resultados, conservando a distinção entre build e teste nativo.
    suggested_owner: dev
resolved_issues:
  - id: TEST-001
    finding: A revisão anterior não tinha evidência de compra externa de teste
      aprovada/reconciliada.
    resolution: Pagamento de teste 190842627252 APROVADO, confirmado
      independentemente por QA usando o gateway real. Referência,
      vendedor/comprador esperados, BRL/10480 centavos, metadados de
      pedido/teste e ausência de reembolso validados; três reconciliações sem
      duplicação; isolamento e biblioteca restaurados após reinício de API/app
      web e novo login.
    limitation: A fixture já continha os dois itens/chaves demonstrativos. A
      aprovação externa os reutilizou sem duplicar; inserção de itens novos foi
      comprovada nos testes transacionais com outro usuário, não nessa compra
      externa.
  - id: SEC-001
    finding: Biblioteca legada sem sessão/dono permitia acesso por troca de userId.
    resolution: Rota exige autenticação e propriedade em todos os modos; regressões
      401/403 adicionadas.
  - id: SEC-002
    finding: Alternar para modo simulated permitia atingir pedido remoto pela rota
      legada de pagamento.
    resolution: Vínculo em checkout_operation impede simulação desse pedido,
      inclusive após reinício com outro modo; regressão HTTP no mesmo banco.
  - id: SEC-003
    finding: Rotas diretas sem perfil podiam selecionar cache remoto do jogador padrão.
    resolution: Com API configurada e perfil ausente, dados pessoais são vazios; E2E
      cobre biblioteca/resultado após reload.
  - id: REL-001
    finding: Novo pedido após reload e retomada com carrinho vazio tinham caminhos
      sem ação/acesso.
    resolution: Novo pedido verifica APROVADO no servidor e carrinho vazio conserva
      acesso à referência pendente; E2E específico.
  - id: REL-002
    finding: Produto somente local recusado antes da criação prendia a referência
      antiga.
    resolution: Limpeza somente após 404 autenticado comprovar ausência de pedido;
      correção do carrinho e nova preparação exercitadas.
