top_issues:
  - id: 'TEST-001'
    severity: medium
    finding: 'Não houve execução em dispositivo Android/iOS. Export Android com assets empacotados e E2E web não comprovam renderização de Image, rolagem/teclado ou SQLite no runtime nativo.'
    suggested_action: 'Executar catálogo, filtro, detalhe, carrinho, fallback e retomada de cache em aparelho/emulador SDK 54; registrar o runtime e os resultados reais.'
    suggested_owner: dev

resolved_issues:
  - id: 'REL-001'
    finding: 'O mapa de capas resolvia propriedades herdadas de IDs válidos como constructor em vez da capa genérica.'
    resolution: 'Object.hasOwn aplicado ao mapa e ao gerador. QA conferiu a função com IDs herdados; E2E carregou produto customizado constructor com imagem genérica real.'
  - id: 'REL-002'
    finding: 'Image no runtime web podia assumir altura intrínseca e perder a proporção prevista.'
    resolution: 'Moldura 16:9 com preenchimento absoluto; E2E verificou dimensão natural 768x432, proporção renderizada, carregamento de 32 capas e rolagem ao último item em 320/390 px.'
  - id: 'REQ-001'
    finding: 'A descrição já existente no domínio não aparecia no detalhe.'
    resolution: 'Detalhe passou a exibir o campo e recebeu asserção E2E, sem alterar o contrato do produto.'

