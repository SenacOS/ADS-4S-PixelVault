story_title: 'Ampliar catálogo acadêmico e exibir capas locais'
gate: CONCERNS
status_reason: 'Os 32 produtos-base e suas capas locais foram verificados, com domínio equivalente no cliente/API, migrações preservando dados e 89 testes/74 jornadas web aprovados. A única ressalva é a execução de imagens, navegação e persistência em dispositivo Android/iOS ainda não realizada.'
