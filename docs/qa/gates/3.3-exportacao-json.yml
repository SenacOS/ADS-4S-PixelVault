nfr_validation:
  security:
    status: PASS
    notes: 'Serializador independente do snapshot, campos permitidos e seleção da conta ativa excluem credenciais, identidade pessoal, formulários financeiros, chaves, outra conta e payloads da outbox. A ação não chama rede nem realiza upload.'
  performance:
    status: PASS
    notes: 'Massa demonstrativa pequena; processamento local, trava concorrente e revogação do object URL web após uso.'
  reliability:
    status: CONCERNS
    notes: 'Arquivo real, erro/retentativa, centavos e disponibilidade/falhas do contrato nativo estão cobertos. Escrita/compartilhamento reais no aparelho aguardam validação.'
  maintainability:
    status: PASS
    notes: 'Serializador puro e entrega por plataforma separados; dependências do SDK 54, contrato versionado, ADR, procedimentos e limites documentados.'

